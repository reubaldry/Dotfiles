# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Reduce esc delay
set -sg escape-time 10

set-option -g status-position top

# Theme
set -g @tmux2k-theme 'onedark'
set -g @tmux2k-show-powerline true
set -g @tmux2k-right-plugins " "
set -g @tmux2k-left-plugins "session cwd"

set -g @tmux2k-dark-yellow '#dfa000'
set -g @tmux2k-dark-green '#8da102'

set -g @tmux2k-window-list-colors "black red"
set -g @tmux2k-cwd-colors "blue black"
set -g @tmux2k-cpu-temp-colors "blue black"
set -g @tmux2k-ram-colors "yellow black"



# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'odedlaz/tmux-onedark-theme'
set -g @plugin '2kabhishek/tmux2k'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

